<script>
    $(document).ready(function(){
        var map = L.map('map', { zoomControl: false }).setView([-6.8700, 107.5056], 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        var cctvIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/5695/5695718.png',
    
            iconSize:     [38, 50], // size of the icon
            iconAnchor:   [10, 44], // point of the icon which will correspond to marker's location
            popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
        });
        $.ajax({

            url : '/get-cctv',
            type : 'GET',
            dataType:'json',
            success : function(data) {              
                for (let q = 0; q < data.data.length; q++) {
                    let koordinat = data.data[q].koordinat
                    let arrKoordinat = koordinat.split(",")
                    let longitude = arrKoordinat[0]
                    let latitude  = arrKoordinat[1]
                    var cctv = L.marker([longitude,latitude], {icon: cctvIcon}).addTo(map);

                    cctv.bindPopup(`<div class="modal-content rounded-4 shadow">
                        <div class="modal-header border-bottom-0" style="text-align: center;">
                        <h6 class="mt-3">`+data.data[q].nama_cctv+`</h6>
                        </div>
                        <div class="modal-body py-0">
                            <iframe style="width:300px;" src="`+data.data[q].link+`" 
                            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
                            </iframe>
                        </div>
                        </div>`,{
                        maxWidth: 300
                    });
                }
            },
            error : function(request,error)
            {
                alert("Request: "+JSON.stringify(request));
            }
        });

        $('.js-example-basic-single').select2();

        $('.js-example-basic-single').on('change', function(){
            $.ajax({
            data: {id : $('.js-example-basic-single').val()},
            url : '/set-cctv',
            type : 'GET',
            dataType:'json',
            success : function(data) {              
                let koordinat = data.data.koordinat
                let arrKoordinat = koordinat.split(",")
                let longitude = arrKoordinat[0]
                let latitude  = arrKoordinat[1]
                var cctv = L.marker([longitude,latitude], {icon: cctvIcon}).addTo(map);

                cctv.bindPopup(`<div class="modal-content rounded-4 shadow">
                    <div class="modal-header border-bottom-0" style="text-align: center;">
                    <h6 class="mt-3">`+data.data.nama_cctv+`</h6>
                    </div>
                    <div class="modal-body py-0">
                        <iframe style="width:300px;" src="`+data.data.link+`" 
                        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
                        </iframe>
                    </div>
                    </div>`,{
                    maxWidth: 300
                }).openPopup();
            },
            error : function(request,error)
            {
                alert("Request: "+JSON.stringify(request));
            }
            });
        })
    })
    
</script>
