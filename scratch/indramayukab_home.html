        <script>
            // Define a global function to apply overlays (watermarks).
            window.applyWatermark = function(player) {
                const watermarkSettings = {"watermark_enabled":true,"watermark_type":"image","watermark_text":"KOMDIGI","watermark_image":"\/storage\/watermarks\/qfg9vOohLndQP1NElSlZBeAMX3aQsMcHFKAWpU9y.png","watermark_position":"top-right","watermark_opacity":"0.5"};

                if (player && watermarkSettings && watermarkSettings.watermark_enabled) {
                    // videojs-overlay can handle multiple overlays, but we'll add just one.
                    // First, ensure any previous overlay is removed to prevent duplicates on re-init.
                    if (player.overlay) {
                        try {
                           player.overlay.remove();
                        } catch(e) { 
                           console.warn('Could not remove previous overlay, maybe it was not there.');
                        }
                    }

                    let overlayContent = '';
                    const opacityStyle = `opacity: ${parseFloat(watermarkSettings.watermark_opacity) || 0.7};`;

                    if (watermarkSettings.watermark_type === 'text' && watermarkSettings.watermark_text) {
                        overlayContent = `<div style="padding: 10px; font-size: 1.2em; color: white; background: rgba(0,0,0,0.2); ${opacityStyle}"><strong>${watermarkSettings.watermark_text}</strong></div>`;
                    } else if (watermarkSettings.watermark_type === 'image' && watermarkSettings.watermark_image) {
                        overlayContent = `<img src="${watermarkSettings.watermark_image}" style="${opacityStyle}" alt="Watermark">`;
                    } else {
                        return; // No valid content to display
                    }

                    let alignPosition = watermarkSettings.watermark_position || 'bottom-right';
                    let customClass = ''; // For special positioning

                    if (alignPosition === 'center') {
                        // For centering, we wrap the content in a flex container
                        // and make the main overlay container fill the player.
                        overlayContent = `<div class="watermark-center-wrapper">${overlayContent}</div>`;
                        alignPosition = 'top-left'; // Set a base alignment for the plugin
                        customClass = ' vjs-overlay-fullscreen'; // Add our custom class
                    }

                    player.overlay({
                        content: overlayContent,
                        overlays: [{
                            content: overlayContent,
                            start: 'playing',
                            end: 'ended',
                            align: alignPosition,
                            class: customClass
                        }]
                    });
                }
            };

            // Add a global hook to apply the watermark to ANY player created on the page.
            videojs.hook('setup', function(player) {
                // The 'ready' event is the safest moment to interact with the player.
                player.ready(function() {
                    const thisPlayer = this;
                    // Use a timeout to push this to the end of the execution queue,
                    // ensuring the player's DOM is fully available.
                    setTimeout(function() {
                        window.applyWatermark(thisPlayer);
                    }, 0);
                });
            });
        </script>
        
        <script>
            // Make the player modal draggable and resizable
            document.addEventListener('DOMContentLoaded', function () {
                const modal = document.getElementById('playerModal');
                if (!modal) return;
    
                const modalDialog = modal.querySelector('.modal-dialog');
                const modalContent = modal.querySelector('.modal-content');
                const modalHeader = modal.querySelector('.modal-header');
                
                let isDragging = false;
                let offset = { x: 0, y: 0 };
    
                if (modalHeader) {
                    modalHeader.addEventListener('mousedown', function (e) {
                        if (e.target.closest('button')) return;
                        
                        isDragging = true;
                        
                        const rect = modalDialog.getBoundingClientRect();
                        offset = {
                            x: e.clientX - rect.left,
                            y: e.clientY - rect.top
                        };
                        
                        modalDialog.style.width = `${rect.width}px`;
                        modalDialog.classList.remove('modal-dialog-centered');
                        modalDialog.style.margin = '0';
                    });
                }
    
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';
                modalContent.appendChild(resizeHandle);
    
                let isResizing = false;
                let originalMouseX = 0;
                let originalWidth = 0;
    
                resizeHandle.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    isResizing = true;
                    originalMouseX = e.clientX;
                    originalWidth = modalDialog.getBoundingClientRect().width;
                });
    
                document.addEventListener('mousemove', function (e) {
                    if (isDragging) {
                        e.preventDefault();
                        const newX = e.clientX - offset.x;
                        const newY = e.clientY - offset.y;
                        modalDialog.style.position = 'absolute';
                        modalDialog.style.left = `${newX}px`;
                        modalDialog.style.top = `${newY}px`;
                    }
    
                    if (isResizing) {
                        const dx = e.clientX - originalMouseX;
                        const newWidth = originalWidth + dx;
                        if (newWidth > 320) { // Minimum width
                            modalDialog.style.width = `${newWidth}px`;
                        }
                    }
                });
    
                document.addEventListener('mouseup', function () {
                    isDragging = false;
                    isResizing = false;
                });
    
                modal.addEventListener('hidden.bs.modal', function () {
                    modalDialog.classList.add('modal-dialog-centered');
                    modalDialog.style.position = '';
                    modalDialog.style.left = '';
                    modalDialog.style.top = '';
                    modalDialog.style.width = '';
                    modalDialog.style.margin = '';
                });
            });
        </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const map = L.map('map').setView([-6.34, 108.32], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    
    const videoModalElement = document.getElementById('playerModal');
    const modal = new bootstrap.Modal(videoModalElement);
    let player = null;
    let allCctvData = [];
    const markers = {};
    const groups = new Map();

    window.showPlayerModal = (stream) => {
        if (player) {
            player.dispose();
            player = null;
        }
        document.getElementById('stream-name').textContent = stream.name;
        document.getElementById('stream-group').textContent = stream.group ? stream.group.name : 'Uncategorized';
        const playerContainer = document.getElementById('player-container');
        // Clear previous player
        playerContainer.innerHTML = ''; 
        // Create new video element
        const videoEl = document.createElement('video-js');
        videoEl.id = 'cctv-player';
        videoEl.className = 'vjs-fluid';
        videoEl.setAttribute('controls', '');
        videoEl.setAttribute('autoplay', '');
        videoEl.setAttribute('muted', '');
        videoEl.setAttribute('playsinline', '');
        playerContainer.appendChild(videoEl);

        player = videojs(videoEl, { 
            html5: { vhs: { overrideNative: true } }, 
            liveui: true,
            responsive: true, 
            fill: true,
            sources: [{ src: stream.hls_url, type: 'application/x-mpegURL' }]
        });

        player.on('error', function() {
            const errorMarker = markers[stream.id];
            if (errorMarker) {
                // Gunakan warna grup yang ada untuk ikon error
                const groupColor = allCctvData.find(cctv => cctv.id === stream.id)?.group?.color || '#808080';
                errorMarker.setIcon(createCustomIcon(groupColor, 'error'));
            }
            // Tutup modal dan tampilkan peringatan
            modal.hide();
            setTimeout(() => {
                alert(`Stream untuk "${stream.name}" tidak dapat diputar atau sedang offline.`);
            }, 200); // Timeout untuk mencegah alert memblokir animasi tutup modal
        });

        player.ready(function() {
            const a_player = this;
            // Use a timeout to ensure the DOM is fully painted before applying the watermark
            setTimeout(function() {
                if (window.applyWatermark) {
                    window.applyWatermark(a_player);
                }
            }, 0);
            
            this.play().catch(e => console.error("Autoplay error:", e));
        });

        modal.show();
        setActiveListItem(stream.id);
    };

    videoModalElement.addEventListener('hidden.bs.modal', function () {
        if (player) {
            player.dispose();
            player = null;
        }
    });

    function createCustomIcon(color, status) {
      let iconHtml = '<i class="fas fa-video"></i>';
      if (status !== 'active') {
          iconHtml += '<i class="fas fa-times"></i>';
      }

      const randomClass = 'marker-' + Math.random().toString(36).substr(2, 9);

      const style = document.createElement('style');
      style.textContent = `
          .${randomClass} {
              background-color: ${color} !important;
              width: 30px !important;
              height: 30px !important;
              line-height: 30px !important;
              text-align: center !important;
              font-size: 16px !important;
          }
      `;
      document.head.appendChild(style);

      return L.divIcon({
          className: `marker-icon ${randomClass}`,
          html: iconHtml,
          iconSize: [30, 30],
          iconAnchor: [15, 15], // pastikan ini titik tengah visual
          popupAnchor: [0, -15]
      });
  }


    function updateLegend() {
        const legendContainer = document.getElementById('legend-items');
        legendContainer.innerHTML = '';
        if (groups.size === 0) return;
        
        const sortedGroups = Array.from(groups.values()).sort((a, b) => a.name.localeCompare(b.name));
        sortedGroups.forEach(group => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<div class="legend-color" style="background-color: ${group.color}"></div><span>${group.name}</span>`;
            legendContainer.appendChild(item);
        });
    }

    function setActiveListItem(cctvId) {
        document.querySelectorAll('.cctv-item').forEach(item => item.classList.remove('active'));
        const activeItem = document.querySelector(`.cctv-item[data-id='${cctvId}']`);
        if (activeItem) {
            activeItem.classList.add('active');
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function renderCCTVList(data) {
        const cctvList = document.getElementById('cctv-list');
        cctvList.innerHTML = '';
        if (!data.length) { cctvList.innerHTML = '<div class="text-center p-5">Tidak ada data ditemukan.</div>'; return; }
        data.forEach(cctv => {
            const item = document.createElement('div');
            item.className = 'cctv-item';
            item.dataset.id = cctv.id;
            item.innerHTML = `<div class="cctv-name">${cctv.name}</div>`;
            item.addEventListener('click', () => {
                if (cctv.status === 'active' && cctv.hls_url) {
                    window.showPlayerModal(cctv);
                } else {
                    alert('CCTV sedang tidak aktif atau tidak memiliki stream.');
                }
            });
            cctvList.appendChild(item);
        });
    }

    fetch('https://cctv.indramayukab.go.id/api/streams')
        .then(response => response.json())
        .then(data => {
            allCctvData = data;
                data.forEach(cctv => {
                    if (cctv.latitude && cctv.longitude && cctv.group) {
                    if (!groups.has(cctv.group.id)) { groups.set(cctv.group.id, { name: cctv.group.name, color: cctv.group.color }); }
                        const markerIcon = createCustomIcon(cctv.group.color, cctv.status);
                    const marker = L.marker([cctv.latitude, cctv.longitude], { icon: markerIcon }).addTo(map);
                    marker.bindTooltip(cctv.name, { permanent: false, direction: 'top', offset: [0, -15], sticky: true });
                        markers[cctv.id] = marker;
                        if (cctv.hls_url && cctv.status === 'active') {
                        marker.on('click', () => window.showPlayerModal(cctv));
                    }
                }
            });
                updateLegend();
            renderCCTVList(allCctvData);
        }).catch(error => {
            console.error('Error fetching CCTV data:', error);
            document.getElementById('cctv-list').innerHTML = '<div class="text-center p-5 text-danger">Gagal memuat data CCTV.</div>';
        });

    document.getElementById('search-input').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        renderCCTVList(allCctvData.filter(cctv => cctv.name.toLowerCase().includes(term)));
    });
    
    document.getElementById('toggle-legend-btn').addEventListener('click', (e) => {
        const icon = e.currentTarget.querySelector('i');
        const legend = document.getElementById('map-legend');
        legend.classList.toggle('minimized');
        icon.className = legend.classList.contains('minimized') ? 'fas fa-plus' : 'fas fa-minus';
    });
});
</script>
    </body>
